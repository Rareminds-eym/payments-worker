name = "razorpay-api-dev"
main = "src/index.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]
account_id = "d10c2b1a3d702c710a036bc5a6d0902e"

# ============================================================================
# LOCAL DEV
# ============================================================================
# wrangler dev reads .dev.vars automatically for secrets when --env-file is set.
# Port is also declared here as a fallback.

[dev]
port = 9003

# ============================================================================
# BINDINGS
# ============================================================================
# Run `npm run kv:create` once to provision, then paste the returned id below.

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a162f140e4464515a8d5a27b5ebc6c6b"

[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "payment-webhooks-queue-dev"

# ============================================================================
# OBSERVABILITY
# ============================================================================

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# ============================================================================
# VARIABLES
# ============================================================================
# Non-secret vars only. All secrets are set via: wrangler secret put

# Default (dev) — used when deploying with: npm run deploy
[vars]
ENVIRONMENT = "dev"
ALLOWED_ORIGINS = "https://dev.skillpassports.com,https://*.pages.dev"

# ============================================================================
# STAGING — wrangler deploy --env staging
# Deploys as: razorpay-api-staging
# ============================================================================

[env.staging]
name = "razorpay-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
ALLOWED_ORIGINS = "https://staging.skillpassports.com,https://*.pages.dev"

[[env.staging.queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "payment-webhooks-queue-staging"

# ============================================================================
# DEMO — wrangler deploy --env demo
# Deploys as: razorpay-api-demo
# ============================================================================

[env.demo]
name = "razorpay-api-demo"

[env.demo.vars]
ENVIRONMENT = "demo"
ALLOWED_ORIGINS = "https://demo.skillpassports.com,https://*.pages.dev"

[[env.demo.queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "payment-webhooks-queue-demo"

# ============================================================================
# PRODUCTION — wrangler deploy --env production
# Deploys as: razorpay-api-production
# ============================================================================

[env.production]
name = "razorpay-api-production"

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://skillpassport.rareminds.in,https://www.skillpassport.rareminds.in,https://*.pages.dev"

[[env.production.queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "payment-webhooks-queue-production"

