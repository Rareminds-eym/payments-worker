name = "razorpay-api-dev"
main = "src/index.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# LOCAL DEV
# ============================================================================
# wrangler dev reads .dev.vars automatically for secrets when --env-file is set.
# Port is also declared here as a fallback.

[dev]
port = 9003

# ============================================================================
# BINDINGS
# ============================================================================
# Run `npm run kv:create` once to provision, then paste the returned id below.

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a01a250ae61941a6adb3b4c702b6ea2f"
preview_id = "a01a250ae61941a6adb3b4c702b6ea2f"

# ============================================================================
# OBSERVABILITY
# ============================================================================

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# ============================================================================
# VARIABLES
# ============================================================================
# Non-secret vars only. All secrets are set via: wrangler secret put

# Default (dev) — used when deploying with: wrangler deploy
[vars]
ENVIRONMENT = "dev"
ALLOWED_ORIGINS = "https://dev.skillpassports.com"

# ─── LOCAL DEV ONLY ──────────────────────────────────────────────────────────
# These vars are overridden by .dev.vars when wrangler dev loads it.
# If wrangler fails to load .dev.vars, these placeholders prevent silent failures.
# Real secrets for local dev go in .dev.vars (gitignored).
# NEVER put real production secrets here.

# Development — wrangler deploy --env development
[env.development.vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "https://skillpassport.rareminds.in,https://www.skillpassport.rareminds.in"

# ============================================================================
# STAGING — wrangler deploy --env staging
# Deploys as: razorpay-api-staging
# ============================================================================
[env.staging]
name = "razorpay-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
ALLOWED_ORIGINS = "https://staging.skillpassports.com"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "bd5c0a1fa7554a91b6acbff1b345997e"

# ============================================================================
# DEMO — wrangler deploy --env demo
# Deploys as: razorpay-api-demo
# ============================================================================
[env.demo]
name = "razorpay-api-demo"

[env.demo.vars]
ENVIRONMENT = "demo"
ALLOWED_ORIGINS = "https://demo.skillpassports.com"

[[env.demo.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "ea3223cc72424e06a73f5916b024f906"

# ============================================================================
# PRODUCTION — wrangler deploy --env production
# Deploys as: razorpay-api-production
# ============================================================================
[env.production]
name = "razorpay-api-production"

[env.production.vars]
ENVIRONMENT = "production"
# Add all production domains here — comma-separated, no spaces around commas
ALLOWED_ORIGINS = "https://skillpassport.rareminds.in,https://www.skillpassport.rareminds.in"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a162f140e4464515a8d5a27b5ebc6c6b"
