name = "razorpay-api"
main = "src/index.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 9003

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a162f140e4464515a8d5a27b5ebc6c6b"

[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "payment-webhooks-queue"

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:5173,http://localhost:8788,http://localhost:9003,https://*.rareminds.in,https://*.pages.dev,https://rareminds.in,https://www.rareminds.in,https://rareminds-website.pages.dev,http://127.0.0.1:8788,http://127.0.0.1:9003"
